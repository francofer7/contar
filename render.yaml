databases:
  - name: contar-db
    databaseName: contar
    user: contar
    plan: free
    region: virginia
    ipAllowList: []

services:
  - type: web
    name: contar
    runtime: ruby
    plan: free
    region: virginia
    branch: main
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /health
    initialDeployHook: bundle exec rails db:seed
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contar-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: CONTAR_ADMIN_EMAIL
        sync: false
      - key: CONTAR_ADMIN_PASSWORD
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MAX_THREADS
        value: 5
      - key: WEB_CONCURRENCY
        value: 2
      - key: BUNDLE_WITHOUT
        value: development:test
